openapi: 3.0.3
info:
  title: Dupip Morpheus API
  version: 1.0.0
  description: >
    HTTP API for the Dupip application. Authentication uses Clerk session
    cookies; most routes require an authenticated user. Errors use the shape
    `{ "error": "message" }`.
servers:
  - url: https://www.dupip.com
    description: Production
  - url: https://beta.dupip.com
    description: Nightly
  - url: http://localhost:3000
    description: Local development
security:
  - cookieAuth: []

tags:
  - name: attachments
  - name: auth
  - name: budgets
  - name: chat
  - name: comments
  - name: cron
  - name: days
  - name: delegation
  - name: events
  - name: friends
  - name: jobs
  - name: likes
  - name: notes
  - name: notifications
  - name: places
  - name: projects
  - name: profile
  - name: search
  - name: sms
  - name: tasklists
  - name: tasks
  - name: telnyx
  - name: templates
  - name: user
  - name: virtual-number
  - name: wallet

paths:
  /api/v1/auth:
    post:
      tags: [auth]
      summary: Clerk webhook receiver
      description: Handles Clerk user.created, session.created, user.updated, and user.deleted events; syncs users and public profiles.
      responses:
        '200': { description: Processed }
        '401': { description: Invalid internal secret }
        '400': { description: Missing Clerk user ID }

  /api/v1/revalidate:
    post:
      tags: [user]
      summary: Revalidate Next.js cache paths/tags
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paths: { type: array, items: { type: string } }
                tags: { type: array, items: { type: string } }
                secretKey: { type: string }
      responses:
        '200': { description: Revalidated }
        '401': { description: Not authenticated }

  /api/v1/cron/unread-chat-emails:
    get:
      tags: [chat]
      summary: Send unread chat email notifications
      description: Authorized cron endpoint; fans out unread chat email notifications.
      responses:
        '200': { description: Fan-out result }
        '401': { description: Unauthorized cron request }

  /api/v1/budgets:
    get:
      tags: [budgets]
      summary: List the current user's budgets
      responses:
        '200': { description: Budgets }
    post:
      tags: [budgets]
      summary: Create a budget (name, totalAmount)
      responses:
        '200': { description: Budget }

  /api/v1/chat:
    post:
      tags: [chat]
      summary: Save agent conversation to a day
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message: {}
      responses:
        '200': { description: Saved }
        '401': { description: Unauthorized }

  /api/v1/chat/sidebar:
    get:
      tags: [chat]
      summary: Fetch chat sidebar
      responses:
        '200': { description: Sidebar data }
        '401': { description: Unauthorized }

  /api/v1/chat/token:
    post:
      tags: [chat]
      summary: Create Ably token request for realtime channels
      responses:
        '200': { description: Ably token request }
        '401': { description: Unauthorized }

  /api/v1/chat/unread-count:
    get:
      tags: [chat]
      summary: Get current user unread message count
      responses:
        '200': { description: Unread count }
        '401': { description: Unauthorized }

  /api/v1/chat/read-state:
    post:
      tags: [chat]
      summary: Mark a channel or DM as read
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channelId: { type: string }
                dmConversationId: { type: string }
                lastReadMessageId: { type: string }
      responses:
        '200': { description: Read state }
        '401': { description: Unauthorized }

  /api/v1/chat/dm-candidates:
    get:
      tags: [chat]
      summary: Search friend/close-friend DM candidates
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200': { description: Candidates }
        '401': { description: Unauthorized }

  /api/v1/chat/dms:
    get:
      tags: [chat]
      summary: List current user DMs
      responses:
        '200': { description: Conversations }
        '401': { description: Unauthorized }
    post:
      tags: [chat]
      summary: Create or open a direct message
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [participantUserId]
              properties:
                participantUserId: { type: string }
      responses:
        '200': { description: Conversation }
        '403': { description: Not friends }

  /api/v1/chat/dms/{conversationId}/messages:
    get:
      tags: [chat]
      summary: List DM messages
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: Messages }
    post:
      tags: [chat]
      summary: Send DM message
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Created }

  /api/v1/chat/channels/{channelId}:
    patch:
      tags: [chat]
      summary: Update a channel
      parameters:
        - { name: channelId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated channel }
    delete:
      tags: [chat]
      summary: Archive a channel
      parameters:
        - { name: channelId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Archived }

  /api/v1/chat/channels/{channelId}/messages:
    get:
      tags: [chat]
      summary: List channel messages
      parameters:
        - { name: channelId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: Messages }
    post:
      tags: [chat]
      summary: Send channel message
      parameters:
        - { name: channelId, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Created }

  /api/v1/chat/messages/{messageId}:
    patch:
      tags: [chat]
      summary: Edit own message
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
    delete:
      tags: [chat]
      summary: Soft-delete a message
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }

  /api/v1/chat/messages/{messageId}/thread:
    get:
      tags: [chat]
      summary: Fetch message thread
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Thread }

  /api/v1/chat/orgs:
    get:
      tags: [chat]
      summary: List current user organizations
      responses:
        '200': { description: Organizations }
    post:
      tags: [chat]
      summary: Create an organization
      responses:
        '200': { description: Organization }

  /api/v1/chat/orgs/{orgId}/channels:
    get:
      tags: [chat]
      summary: List organization channels
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Channels }
    post:
      tags: [chat]
      summary: Create an organization channel
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Channel }

  /api/v1/chat/orgs/{orgId}/invites:
    get:
      tags: [chat]
      summary: List organization invite links
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Invites }
    post:
      tags: [chat]
      summary: Create an organization invite
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Invite }

  /api/v1/chat/orgs/{orgId}/roles:
    post:
      tags: [chat]
      summary: Assign a chat role to a user
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Membership }

  /api/v1/chat/invites/{inviteId}:
    delete:
      tags: [chat]
      summary: Revoke an invite
      parameters:
        - { name: inviteId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Revoked }

  /api/v1/chat/invites/{inviteId}/accept:
    post:
      tags: [chat]
      summary: Accept an organization invite
      parameters:
        - { name: inviteId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Accepted }

  /api/v1/comments:
    get:
      tags: [comments]
      summary: List comments for an entity
      parameters:
        - { name: entityType, in: query, required: true, schema: { type: string } }
        - { name: entityId, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Comments }
    post:
      tags: [comments]
      summary: Create a comment
      responses:
        '200': { description: Comment }

  /api/v1/comments/{commentId}:
    put:
      tags: [comments]
      summary: Update own comment
      parameters:
        - { name: commentId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
    delete:
      tags: [comments]
      summary: Delete own comment
      parameters:
        - { name: commentId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }

  /api/v1/contacts/{id}:
    put:
      tags: [user]
      summary: Update contact (legacy model)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
    delete:
      tags: [user]
      summary: Delete contact (legacy model)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }

  /api/v1/days:
    get:
      tags: [days]
      summary: Fetch day(s) for current user
      parameters:
        - { name: date, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: string } }
        - { name: startDate, in: query, schema: { type: string } }
        - { name: endDate, in: query, schema: { type: string } }
      responses:
        '200': { description: Days }
    post:
      tags: [days]
      summary: Create or update a day (mood, contacts, things, life events)
      responses:
        '200': { description: Day }

  /api/v1/debug/task-state:
    get:
      tags: [tasks]
      summary: Debug task/job completion state
      parameters:
        - { name: taskId, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, schema: { type: string } }
      responses:
        '200': { description: Task state }

  /api/v1/delegated-users:
    get:
      tags: [delegation]
      summary: List outgoing/incoming delegations and friend suggestions
      responses:
        '200': { description: Delegations }
    post:
      tags: [delegation]
      summary: Create or update a delegation (scopes + roleKeys relationship labels)
      responses:
        '200': { description: Delegation }
        '202': { description: Invitation draft for non-user email }
    delete:
      tags: [delegation]
      summary: Remove an outgoing delegation
      responses:
        '200': { description: Deleted }

  /api/v1/events:
    get:
      tags: [events]
      summary: List current user life events
      responses:
        '200': { description: Life events }
    post:
      tags: [events]
      summary: Create a life event
      responses:
        '200': { description: Life event }

  /api/v1/events/{id}:
    put:
      tags: [events]
      summary: Update own life event
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
    delete:
      tags: [events]
      summary: Delete own life event
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }

  /api/v1/friend-request:
    post:
      tags: [friends]
      summary: Send a friend request by username
      responses:
        '200': { description: Sent }

  /api/v1/friend-request/action:
    post:
      tags: [friends]
      summary: Accept or decline a friend request
      responses:
        '200': { description: Action applied }

  /api/v1/friend-requests:
    get:
      tags: [friends]
      summary: List incoming friend requests
      responses:
        '200': { description: Friend requests }

  /api/v1/friends:
    get:
      tags: [friends]
      summary: List current user friends
      responses:
        '200': { description: Friends }

  /api/v1/friends/unfriend:
    post:
      tags: [friends]
      summary: Remove a friend
      responses:
        '200': { description: Removed }

  /api/v1/friendship-status:
    get:
      tags: [friends]
      summary: Check friendship status with a username
      parameters:
        - { name: targetUserName, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Status }

  /api/v1/hint:
    get:
      tags: [user]
      summary: Generate or fetch AI mood/task insight
      parameters:
        - { name: locale, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
      responses:
        '200': { description: Hint }
        '403': { description: Not authorized }

  /api/v1/jobs:
    get:
      tags: [jobs]
      summary: List jobs (filtered by list/task/worker/status/date)
      responses:
        '200': { description: Jobs }
    post:
      tags: [jobs]
      summary: Create a job (justification required for collaborators)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                documentIds:
                  type: array
                  maxItems: 10
                  items: { type: string }
                  description: Attached Document ids (e.g. a CV uploaded via /api/v1/attachments)
      responses:
        '200': { description: Job }

  /api/v1/jobs/{jobId}:
    get:
      tags: [jobs]
      summary: Get a job
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Job }
    put:
      tags: [jobs]
      summary: Update a job (status transitions, reviews, notes, justification, evidence documentIds, location)
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
    delete:
      tags: [jobs]
      summary: Cancel a job
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancelled }

  /api/v1/attachments/presign:
    post:
      tags: [attachments]
      summary: Presign a direct upload (extension allowlist + per-kind cap; SVG rejected)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, kind, size]
              properties:
                fileName: { type: string }
                mimeType: { type: string }
                kind: { type: string, enum: [image, video, document, cv] }
                size: { type: integer }
                role: { type: string, enum: [cover, flier, evidence, inline, cv] }
      responses:
        '200': { description: '{ uploadUrl, key, publicUrl, expiresIn }' }
        '503': { description: Storage not configured }

  /api/v1/attachments:
    get:
      tags: [attachments]
      summary: List the caller's own documents (?kind=cv&mine=true, newest first, take <= 50)
      parameters:
        - { name: mine, in: query, required: true, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: '{ documents }' }
    post:
      tags: [attachments]
      summary: Confirm upload (key prefix, HEAD cap, magic-byte sniff) and create+link Document
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [key, fileName, kind, entityType, entityId]
              properties:
                key: { type: string }
                fileName: { type: string }
                kind: { type: string, enum: [image, video, document, cv] }
                entityType: { type: string, enum: [task, list, job, note, user] }
                entityId: { type: string }
                role: { type: string, enum: [cover, flier, evidence, inline, cv] }
                width: { type: integer }
                height: { type: integer }
                duration: { type: number }
                location: { type: object }
      responses:
        '200': { description: '{ document }' }
        '403': { description: Key outside caller prefix / not permitted on entity }
        '400': { description: Cap exceeded or content/type mismatch (object deleted) }

  /api/v1/attachments/{documentId}:
    delete:
      tags: [attachments]
      summary: Delete attachment (owner only; unlink arrays, delete object, delete row)
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ message: Attachment deleted }' }
    patch:
      tags: [attachments]
      summary: Update the attachment location (owner only; null clears it)
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [location]
              properties:
                location:
                  oneOf:
                    - type: object
                      properties:
                        lat: { type: number }
                        lng: { type: number }
                        placeId: { type: string }
                        name: { type: string }
                        address: { type: string }
                    - type: 'null'
      responses:
        '200': { description: '{ document }' }
        '400': { description: Invalid location shape }
        '401': { description: Unauthorized }
        '403': { description: Not the owner }
        '404': { description: Attachment not found }

  /api/v1/attachments/{documentId}/file:
    get:
      tags: [attachments]
      summary: Authenticated media pipe from the private storage bucket (streams bytes; Range supported)
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Object bytes with sniffed Content-Type }
        '206': { description: Partial content (video seeking) }
        '401': { description: Authentication required for non-public documents }
        '403': { description: Not linked to the document }
        '404': { description: Attachment or object not found }

  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: List the current user's notifications (newest first, last 30, with unread count)
      responses:
        '200': { description: '{ notifications, unreadCount }' }
    post:
      tags: [notifications]
      summary: Mark notifications as read (given ids, or all when omitted)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string } }
      responses:
        '200': { description: '{ updated }' }

  /api/v1/places/autocomplete:
    get:
      tags: [places]
      summary: Google Places autocomplete proxy (5 results, 5-min LRU, per-user rate limit)
      parameters:
        - { name: input, in: query, required: true, schema: { type: string } }
        - { name: sessionToken, in: query, schema: { type: string } }
      responses:
        '200': { description: '{ predictions: [{ placeId, description }] }' }
        '503': { description: Places not configured }

  /api/v1/places/details:
    get:
      tags: [places]
      summary: Google Places details proxy (canonical 5-field location)
      parameters:
        - { name: placeId, in: query, required: true, schema: { type: string } }
        - { name: sessionToken, in: query, schema: { type: string } }
      responses:
        '200': { description: '{ location: { lat, lng, placeId, name, address } }' }

  /api/v1/places/geocode:
    get:
      tags: [places]
      summary: Reverse-geocode lat/lng into enriched place metadata (server proxy)
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
      responses:
        '200': { description: '{ location: { lat, lng, placeId, name, address } }' }
        '503': { description: Places not configured }

  /api/v1/places/staticmap:
    get:
      tags: [places]
      summary: Google Static Maps image proxy (API key stays server-side)
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: zoom, in: query, schema: { type: number } }
      responses:
        '200': { description: Static map image (cached 24h) }

  /api/v1/likes:
    get:
      tags: [likes]
      summary: Get like status and count
      parameters:
        - { name: entityType, in: query, required: true, schema: { type: string } }
        - { name: entityId, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Like status }
    post:
      tags: [likes]
      summary: Toggle like/unlike
      responses:
        '200': { description: Toggled }

  /api/v1/link-preview:
    get:
      tags: [user]
      summary: Fetch link preview metadata for a URL
      parameters:
        - { name: url, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Link preview }
        '400': { description: Invalid/private URL }

  /api/v1/magazine:
    get:
      tags: [user]
      summary: Fetch CMS articles
      parameters:
        - { name: locale, in: query, schema: { type: string } }
      responses:
        '200': { description: Articles }

  /api/v1/meet-me:
    post:
      tags: [user]
      summary: Book a meeting and email calendar invites
      responses:
        '200': { description: Booked }

  /api/v1/meet-me/availability:
    get:
      tags: [user]
      summary: Fetch CalDAV busy slots for a username
      parameters:
        - { name: username, in: query, required: true, schema: { type: string } }
        - { name: start, in: query, required: true, schema: { type: string } }
        - { name: end, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Busy slots }

  /api/v1/notes:
    get:
      tags: [notes]
      summary: List current user notes (and received notes); with userId, list a delegated user's notes
      parameters:
        - { name: userId, in: query, schema: { type: string }, description: Target delegator's user id (requires a delegation from them) }
        - { name: visibility, in: query, schema: { type: string }, description: Comma-separated visibility filter }
        - { name: noteId, in: query, schema: { type: string } }
      responses:
        '200': { description: Notes }
        '403': { description: Not authorized for selected user data }
    post:
      tags: [notes]
      summary: Create a note (visibility defaults to the user's defaultNoteVisibility, then PRIVATE)
      responses:
        '200': { description: Note }

  /api/v1/notes/{noteId}:
    put:
      tags: [notes]
      summary: Update own note
      parameters:
        - { name: noteId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
    patch:
      tags: [notes]
      summary: Update note visibility only
      parameters:
        - { name: noteId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
    delete:
      tags: [notes]
      summary: Delete own note
      parameters:
        - { name: noteId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }

  /api/v1/notes/{noteId}/comments:
    get:
      tags: [notes]
      summary: List note comments
      parameters:
        - { name: noteId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Comments }
    post:
      tags: [notes]
      summary: Add a comment to a note
      parameters:
        - { name: noteId, in: path, required: true, schema: { type: string } }
      responses:
