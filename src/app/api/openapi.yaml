    post:
      tags: [virtual-number]
      summary: Assign a virtual number (or clear all assignments)
      description: Premium feature (Clerk feature `virtual_number`). Assigns are bounded by the plan quota (Clerk plan slug `dupip_pro`/`dupip_ultra`/`dupip_max` → 1/3/5). Pass `phoneNumber: null` to clear all assignments.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phoneNumber:
                  type: [string, 'null']
                  description: E.164 phone number to assign, or null to clear all
      responses:
        '200': { description: Updated assignments }
        '400': { description: Invalid phoneNumber }
        '401': { description: Unauthorized }
        '403': { description: Not entitled }
        '404': { description: Number not in Telnyx account }
        '409': { description: Number already assigned, or plan quota reached }
