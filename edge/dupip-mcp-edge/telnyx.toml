# Umbrella manifest — hosts the actor (the only place [[actors]] can be
# declared) plus the other bindings that surface as `env.<BINDING>` in TS:
# docs: developers.telnyx.com/docs/edge-compute/runtime/bindings
# Run `telnyx-edge types` after changing bindings to regenerate telnyx-env.d.ts.

name = "dupip-mcp-edge"
main = "src/index.ts"
compatibility_date = "2026-08-30"

# Function identity (written by `telnyx-edge new-func` — ship reads it from
# the umbrella manifest, so func.toml is not used)
[edge_compute]
func_id = "afd30602-9319-45f9-9538-e4d5624ff7f1"
func_name = "dupip-mcp-edge"

# Pre-authenticated Telnyx SDK + injected TELNYX_API_KEY env var
[telnyx]
binding = "TELNYX"

# Caller identity cache (keys: caller/<e164-digits>, owner/<e164-digits>, flags/<name>)
[storage.kv.CALLER_CACHE]
id = "f2692a8f-c3f9-499f-8722-f78fbcdf8196"

[[secrets]]
binding = "MORPHEUS_BASE_URL"      # env handle
name = "MORPHEUS_BASE_URL"         # secret key in the platform secret store
[[secrets]]
binding = "MORPHEUS_EDGE_SECRET"   # matches MCP_EDGE_SECRET / INTERNAL_FETCH_SECRET in morpheus
name = "MORPHEUS_EDGE_SECRET"
[[secrets]]
binding = "TELNYX_WEBHOOK_PUBLIC_KEY"  # Ed25519 public key (Mission Control → Keys & Credentials)
name = "TELNYX_WEBHOOK_PUBLIC_KEY"

# Shared fixed-window rate limit on this function's dynamic-variables traffic
[[ratelimits]]
name = "dynamic_variables"
limit = 120
period = 60

# Per-caller call session (single-threaded read-modify-write)
[[actors]]
binding = "CALL_SESSION"
type = "DupipCallSession"
